<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Poker Bot</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="top-bar">
        <span>Раздача #1</span>
        <span>Пот: 3 BB</span>
        <span>Стек: 100 BB</span>
    </div>

    <div class="table-area">
        <!-- Места для игроков (пока пустые) -->
        <div class="player-seat seat-top">P1</div>
        <div class="player-seat seat-left">P2</div>
        <div class="player-seat seat-right">P3</div>
        <div class="player-seat seat-bottom">Вы</div>

        <div class="board" id="board">
            <div class="card red">A♥</div>
            <div class="card red">K♦</div>
            <div class="card">7♣</div>
        </div>
    </div>

    <div class="input-area">
        <div class="grid-13x13" id="matrix">
            <!-- Заглушка -->
            <div class="grid-cell">AA</div>
        </div>
        <div class="buttons-row">
            <button class="primary">Сделать ход</button>
            <button>Новая раздача</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
