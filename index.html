<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Poker Bot</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --table-color: #0b6623;
            --card-bg: #ffffff;
            --card-text-black: #000000;
            --card-text-red: #d32f2f;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; user-select: none; }
        html, body { height: 100%; overflow: hidden; background-color: var(--bg-color); color: white; }
        body { display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
        
        .top-bar { display: flex; justify-content: space-between; padding: 8px 15px; background-color: #222; font-size: 14px; border-bottom: 1px solid #444; flex-shrink: 0; }
        
        /* Сам стол */
        .table-area { 
            flex: 1; 
            background-color: var(--table-color); 
            margin: 10px; 
            border-radius: 100px; /* Более круглый овал */
            border: 6px solid #4a2c12; 
            position: relative; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }

        /* Кружки игроков */
        .player-seat { 
            position: absolute; 
            width: 45px; 
            height: 45px; 
            background-color: rgba(0, 0, 0, 0.7); 
            border-radius: 50%; 
            border: 2px solid #fff; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 12px; 
            font-weight: bold; 
            color: #ccc; 
        }

        /* Жесткая расстановка по овалу */
        /* Верх */
        .seat-1 { top: 2%; left: 50%; transform: translateX(-50%); }
        /* Правая сторона */
        .seat-2 { top: 15%; right: 15%; transform: translateX(50%); }
        .seat-3 { top: 50%; right: 2%; transform: translateY(-50%); }
        .seat-4 { bottom: 15%; right: 15%; transform: translateX(50%); }
        /* Низ */
        .seat-5 { bottom: 2%; left: 50%; transform: translateX(-50%); }
        /* Левая сторона */
        .seat-6 { bottom: 15%; left: 15%; transform: translateX(-50%); }
        .seat-7 { top: 50%; left: 2%; transform: translateY(-50%); }
        .seat-8 { top: 15%; left: 15%; transform: translateX(-50%); }
        /* Внутреннее место (P9) */
        .seat-9 { top: 20%; right: 25%; transform: translateX(50%); }

        .board { display: flex; gap: 8px; z-index: 2; }
        .card { width: 50px; height: 75px; background-color: var(--card-bg); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: bold; color: var(--card-text-black); box-shadow: 0 4px 8px rgba(0,0,0,0.6); }
        .card.red { color: var(--card-text-red); }
    </style>
</head>
<body>

    <div class="top-bar">
        <span>Раздача #1</span>
        <span>Пот: 3 BB</span>
        <span>Стек: 100 BB</span>
    </div>

    <div class="table-area">
        <div class="player-seat seat-1">P1</div>
        <div class="player-seat seat-2">P2</div>
        <div class="player-seat seat-3">P3</div>
        <div class="player-seat seat-4">P4</div>
        <div class="player-seat seat-5">Вы</div>
        <div class="player-seat seat-6">P6</div>
        <div class="player-seat seat-7">P7</div>
        <div class="player-seat seat-8">P8</div>
        <div class="player-seat seat-9">P9</div>

        <div class="board" id="board">
            <div class="card red">A♥</div>
            <div class="card red">K♦</div>
            <div class="card">7♣</div>
        </div>
    </div>

</body>
        </html>
