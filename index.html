<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Poker Bot</title>
    <!-- Добавлена версия ?v=2, чтобы Telegram скачал новый стиль -->
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body>

    <div class="top-bar">
        <span>Раздача #1</span>
        <span>Пот: 3 BB</span>
        <span>Стек: 100 BB</span>
    </div>

    <div class="table-area">
        <!-- 9 мест для игроков -->
        <div class="player-seat seat-1">P1</div>
        <div class="player-seat seat-2">P2</div>
        <div class="player-seat seat-3">P3</div>
        <div class="player-seat seat-4">P4</div>
        <div class="player-seat seat-5">Вы</div>
        <div class="player-seat seat-6">P6</div>
        <div class="player-seat seat-7">P7</div>
        <div class="player-seat seat-8">P8</div>
        <div class="player-seat seat-9">P9</div>

        <!-- Карты на столе (пока заглушка) -->
        <div class="board" id="board">
            <div class="card red">A♥</div>
            <div class="card red">K♦</div>
            <div class="card">7♣</div>
        </div>
    </div>

    <!-- Нижняя панель скрыта стилями -->
    <div class="input-area">
        <div class="grid-13x13" id="matrix"></div>
    </div>

    <script src="app.js"></script>
</body>
    </html>
