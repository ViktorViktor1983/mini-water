<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Poker Bot</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --table-color: #0b6623;
            --card-bg: #ffffff;
            --card-text-black: #000000;
            --card-text-red: #d32f2f;
            --panel-bg: #222222;
            --btn-bg: #444444;
            --btn-active: #ff9800;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; user-select: none; }
        html, body { height: 100%; overflow: hidden; background-color: var(--bg-color); color: white; }
        body { display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
        
        .top-bar { display: flex; justify-content: space-between; padding: 8px 15px; background-color: #222; font-size: 14px; border-bottom: 1px solid #444; flex-shrink: 0; position: relative; z-index: 20;}
        
        .mode-switch { position: absolute; left: 15px; top: 8px; display: flex; background: #111; border-radius: 5px; overflow: hidden; font-size: 12px;}
        .mode-switch span { padding: 2px 8px; color: #888; cursor: pointer; }
        .mode-switch span.active { background: #333; color: white; }

        .table-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }

        .table-area { 
            width: 100%;
            max-width: 60vh; 
            max-height: 100%; 
            aspect-ratio: 2 / 3; 
            background-color: var(--table-color); 
            border-radius: 70px; 
            border: 6px solid #4a2c12; 
            position: relative; 
            overflow: hidden; 
        }

        .player-seat, .seat-me { 
            position: absolute; 
            width: 40px; height: 40px; 
            background-color: rgba(0, 0, 0, 0.7); 
            border-radius: 50%; border: 2px solid #fff; 
            display: flex; align-items: center; justify-content: center; 
            font-size: 12px; font-weight: bold; color: #ccc; 
            transform: translate(-50%, -50%); 
            z-index: 10;
        }

        /* Борд (5 карт) */
        .board { 
            display: flex; gap: 5px; z-index: 2; position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%);
        }
        
        /* Общий стиль для карт и слотов */
        .card, .board-slot { 
            width: 40px; height: 60px; 
            background-color: var(--card-bg); 
            border-radius: 6px; 
            display: flex; align-items: center; justify-content: center; 
            font-size: 18px; font-weight: bold; 
            color: var(--card-text-black); 
            box-shadow: 0 4px 8px rgba(0,0,0,0.6); 
        }
        .card.red { color: var(--card-text-red); }

        /* Слоты для пустых карт */
        .board-slot {
            background-color: rgba(0, 0, 0, 0.3);
            border: 2px dashed #777;
            color: #777;
            cursor: pointer;
            box-shadow: none;
        }
        
        /* Разделитель (промежуток между 3-й и 4-й картой) */
        .separator { width: 10px; }

        /* Мои карты */
        .my-cards { 
            position: absolute; bottom: 15%; left: 50%; transform: translateX(-50%); 
            display: flex; gap: 10px; z-index: 15;
        }
        .my-card-slot {
            width: 45px; height: 65px;
            background-color: #333; border: 2px dashed #777; border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; color: #777; cursor: pointer;
            transition: background 0.2s;
        }
        .my-card-slot.filled { background-color: var(--card-bg); border: none; color: var(--card-text-black); }
        .my-card-slot.filled.red { color: var(--card-text-red); }

        .control-panel {
            background-color: var(--panel-bg);
            border-top-left-radius: 15px; border-top-right-radius: 15px;
            padding: 15px; display: flex; flex-direction: column; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .advice-text { font-size: 24px; font-weight: bold; color: #ff9800; text-align: center; }

        /* Панель ввода */
        .input-panel {
            position: absolute; bottom: -100%; left: 0; width: 100%;
            background-color: var(--panel-bg);
            border-top-left-radius: 20px; border-top-right-radius: 20px;
            padding: 20px; z-index: 50;
            transition: bottom 0.3s ease;
            display: flex; flex-direction: column; gap: 10px;
        }
        .input-panel.active { bottom: 0; }

        .row { display: flex; gap: 5px; justify-content: center; }
        .input-btn {
            flex: 1; padding: 15px 0;
            background-color: var(--btn-bg); border: none; border-radius: 8px;
            color: white; font-size: 18px; font-weight: bold; cursor: pointer;
        }
        .input-btn:active { background-color: var(--btn-active); color: black; }
        
        .suits-row { display: none; gap: 10px; justify-content: center; margin-top: 10px; }
        .suits-row.active { display: flex; }
        .suit-btn {
            flex: 1; padding: 20px 0;
            background-color: var(--btn-bg); border: none; border-radius: 8px;
            color: white; font-size: 24px; cursor: pointer;
        }
        .suit-btn:active { background-color: var(--btn-active); color: black; }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="mode-switch">
            <span class="active">Профи</span>
            <span>Быстрый</span>
        </div>
        <span>Раздача #1</span>
    </div>

    <div class="table-container">
        <div class="table-area" id="table-area">
            <div class="seat-me" id="me" style="left: 50.7%; top: 95.0%;">Вы</div>
            
            <!-- Мои карты -->
            <div class="my-cards">
                <div class="my-card-slot" id="slot-1" onclick="openInput(1)">?</div>
                <div class="my-card-slot" id="slot-2" onclick="openInput(2)">?</div>
            </div>

            <!-- Борд (5 мест + разделитель) -->
            <div class="board">
                <div class="board-slot" id="board-1" onclick="openBoardInput(1)">?</div>
                <div class="board-slot" id="board-2" onclick="openBoardInput(2)">?</div>
                <div class="board-slot" id="board-3" onclick="openBoardInput(3)">?</div>
                <div class="separator"></div>
                <div class="board-slot" id="board-4" onclick="openBoardInput(4)">?</div>
                <div class="board-slot" id="board-5" onclick="openBoardInput(5)">?</div>
            </div>

            <!-- Игроки -->
            <div class="player-seat" id="p1" style="left: 27.5%; top: 5.2%;">P1</div>
            <div class="player-seat" id="p2" style="left: 73.3%; top: 5.0%;">P2</div>
            <div class="player-seat" id="p3" style="left: 92.3%; top: 28.8%;">P3</div>
            <div class="player-seat" id="p4" style="left: 92.9%; top: 59.5%;">P4</div>
            <div class="player-seat" id="p5" style="left: 92.6%; top: 86.5%;">P5</div>
            <div class="player-seat" id="p6" style="left: 6.8%; top: 85.5%;">P6</div>
            <div class="player-seat" id="p7" style="left: 7.3%; top: 60.0%;">P7</div>
            <div class="player-seat" id="p8" style="left: 7.7%; top: 30.1%;">P8</div>
        </div>
    </div>

    <div class="control-panel">
        <div class="advice-text">Ожидание хода...</div>
    </div>

    <!-- Панель ввода -->
    <div class="input-panel" id="input-panel">
        <button class="close-btn" onclick="closeInput()" style="background:#d32f2f; color:white; border:none; padding:10px; border-radius:8px; font-weight:bold; margin-bottom:10px;">Отмена</button>
        
        <div id="ranks-view">
            <div class="row">
                <button class="input-btn" onclick="selectRank('A')">A</button>
                <button class="input-btn" onclick="selectRank('K')">K</button>
                <button class="input-btn" onclick="selectRank('Q')">Q</button>
                <button class="input-btn" onclick="selectRank('J')">J</button>
            </div>
            <div class="row" style="margin-top:5px;">
                <button class="input-btn" onclick="selectRank('T')">10</button>
                <button class="input-btn" onclick="selectRank('9')">9</button>
                <button class="input-btn" onclick="selectRank('8')">8</button>
                <button class="input-btn" onclick="selectRank('7')">7</button>
            </div>
            <div class="row" style="margin-top:5px;">
                <button class="input-btn" onclick="selectRank('6')">6</button>
                <button class="input-btn" onclick="selectRank('5')">5</button>
                <button class="input-btn" onclick="selectRank('4')">4</button>
                <button class="input-btn" onclick="selectRank('3')">3</button>
                <button class="input-btn" onclick="selectRank('2')">2</button>
            </div>
        </div>

        <div class="suits-row" id="suits-view">
            <button class="suit-btn" style="color:white;" onclick="selectSuit('♠')">♠</button>
            <button class="suit-btn" style="color:var(--card-text-red);" onclick="selectSuit('♥')">♥</button>
            <button class="suit-btn" style="color:var(--card-text-red);" onclick="selectSuit('♦')">♦</button>
            <button class="suit-btn" style="color:white;" onclick="selectSuit('♣')">♣</button>
        </div>
    </div>

    <script>
        let currentTarget = null; // id элемента (слот или борд)
        let currentRank = "";
        let longPressTimer = null;

        // Долгое нажатие для очистки
        const clearableElements = document.querySelectorAll('.my-card-slot, .board-slot');
        clearableElements.forEach(el => {
            el.addEventListener('touchstart', (e) => {
                longPressTimer = setTimeout(() => {
                    el.innerText = "?";
                    el.classList.remove("filled", "red");
                    el.style.backgroundColor = "rgba(0, 0, 0, 0.3)"; // Возвращаем стиль для борда
                }, 500);
            });
            el.addEventListener('touchend', () => clearTimeout(longPressTimer));
            el.addEventListener('touchmove', () => clearTimeout(longPressTimer));
        });

        // Открытие панели для МОИХ карт
        function openInput(slot) {
            currentTarget = "slot-" + slot;
            showPanel();
        }

        // Открытие панели для БОРДА
        function openBoardInput(slot) {
            currentTarget = "board-" + slot;
            showPanel();
        }

        function showPanel() {
            document.getElementById('ranks-view').style.display = 'block';
            document.getElementById('suits-view').classList.remove('active');
            document.getElementById('input-panel').classList.add('active');
        }

        function closeInput() {
            document.getElementById('input-panel').classList.remove('active');
        }

        function selectRank(rank) {
            currentRank = rank;
            document.getElementById('ranks-view').style.display = 'none';
            document.getElementById('suits-view').classList.add('active');
        }

        function selectSuit(suit) {
            let el = document.getElementById(currentTarget);
            
            // Если это мой слот карт
            if (currentTarget.startsWith("slot-")) {
                el.innerText = currentRank + suit;
                el.classList.add("filled");
                if (suit === '♥' || suit === '♦') el.classList.add("red");
                else el.classList.remove("red");
            } 
            // Если это карта борда
            else {
                el.innerText = currentRank + suit;
                el.classList.add("filled");
                el.style.backgroundColor = "var(--card-bg)"; // Делаем фон белым
                if (suit === '♥' || suit === '♦') el.classList.add("red");
                else el.classList.remove("red");
            }

            closeInput();
        }
    </script>
</body>
</html>
