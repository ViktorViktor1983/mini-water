<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Poker Bot Editor</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --table-color: #0b6623;
            --card-bg: #ffffff;
            --card-text-black: #000000;
            --card-text-red: #d32f2f;
            --panel-bg: #222222;
            --btn-bg: #444444;
            --btn-active: #ff9800;
            --chip-blue: #5c9ead; 
            --chip-red: #d32f2f;  
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; user-select: none; }
        html, body { height: 100%; overflow: hidden; background-color: var(--bg-color); color: white; }
        body { display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
        
        .top-bar { display: flex; justify-content: space-between; padding: 8px 15px; background-color: #222; font-size: 14px; border-bottom: 1px solid #444; flex-shrink: 0; position: relative; z-index: 20;}
        
        .table-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }

        .table-area { 
            width: 100%;
            max-width: 60vh; 
            max-height: 100%; 
            aspect-ratio: 2 / 3; 
            background-color: var(--table-color); 
            border-radius: 70px; 
            border: 6px solid #4a2c12; 
            position: relative; 
            overflow: hidden; 
        }

        .player-seat, .seat-me { 
            position: absolute; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            transform: translate(-50%, -50%); 
            z-index: 10;
            width: 40px; height: 40px;
        }

        .player-cards { display: flex; gap: 2px; position: absolute; transition: opacity 0.3s; z-index: 11; }
        .pos-top { top: 100%; left: 50%; transform: translateX(-50%); margin-top: 2px; }
        .pos-left { right: 100%; top: 50%; transform: translateY(-50%); margin-right: 2px; }
        .pos-right { left: 100%; top: 50%; transform: translateY(-50%); margin-left: 2px; }
        .player-cards.hidden { opacity: 0; }
        .mini-card { width: 14px; height: 20px; background-color: #b0b0b0; border: 1px solid #555; border-radius: 2px; background-image: repeating-linear-gradient(45deg, transparent, transparent 2px, rgba(0,0,0,0.1) 2px, rgba(0,0,0,0.1) 4px); }

        .chip {
            width: 34px; height: 34px;
            background-color: var(--chip-blue);
            border-radius: 50%; border: 3px dashed #fff;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px; font-weight: bold; color: white;
            text-shadow: 1px 1px 2px black; box-shadow: 0 4px 6px rgba(0,0,0,0.5);
            z-index: 12;
        }

        /* Кружки действий - подняли z-index, чтобы их можно было взять */
        .action-badge {
            position: absolute;
            width: 18px; height: 18px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 10px; font-weight: bold;
            z-index: 100; /* Высокий z-index */
            cursor: grab;
            border: 1px solid #fff;
        }
        .badge-call { background-color: #4caf50; color: white; }
        .badge-raise { background-color: #ff9800; color: black; font-size: 8px; }

        /* Панели действий - тоже подняли z-index */
        .action-menu {
            position: absolute;
            background-color: rgba(0,0,0,0.9);
            padding: 6px; border-radius: 8px;
            display: flex; gap: 6px;
            z-index: 100;
            cursor: grab;
            border: 1px dashed rgba(255,255,255,0.3);
        }
        .action-menu button {
            background: #444; color: white; border: none;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold; cursor: pointer;
        }

        .board { display: flex; gap: 5px; z-index: 2; position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%); }
        .board-slot { width: 40px; height: 60px; background-color: rgba(0, 0, 0, 0.3); border: 2px dashed #777; color: #777; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: bold; box-shadow: none; }
        .separator { width: 10px; }

        /* Твои карты - уменьшили z-index, чтобы они не перекрывали кружки */
        .my-cards { position: absolute; bottom: 15%; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; z-index: 15; }
        .my-card-slot { width: 45px; height: 65px; background-color: #333; border: 2px dashed #777; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 20px; color: #777; }

        .control-panel {
            background-color: var(--panel-bg);
            padding: 15px; display: flex; flex-direction: column; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 1000;
            display: none; flex-direction: column; padding: 20px; overflow-y: auto;
        }
        .modal-overlay.active { display: flex; }
        .modal-content { background: #222; padding: 15px; border-radius: 10px; color: #4caf50; font-family: monospace; font-size: 12px; white-space: pre-wrap; margin-top: 20px; }
        .close-btn { background: #d32f2f; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; align-self: flex-start; }
    </style>
</head>
<body>

    <div class="top-bar">
        <span>Раздача #1</span>
    </div>

    <div class="table-container">
        <div class="table-area" id="table-area">
            
            <div class="my-cards">
                <div class="my-card-slot">?</div>
                <div class="my-card-slot">?</div>
            </div>

            <div class="board">
                <div class="board-slot">?</div>
                <div class="board-slot">?</div>
                <div class="board-slot">?</div>
                <div class="separator"></div>
                <div class="board-slot">?</div>
                <div class="board-slot">?</div>
            </div>

            <!-- Игроки -->
            <div class="player-seat" id="p1" style="left: 27.5%; top: 5.2%;">
                <div class="player-cards pos-top"><div class="mini-card"></div><div class="mini-card"></div></div>
                <div class="chip">1</div>
            </div>
            <div class="player-seat" id="p2" style="left: 73.3%; top: 5.0%;">
                <div class="player-cards pos-top"><div class="mini-card"></div><div class="mini-card"></div></div>
                <div class="chip">2</div>
            </div>
            <div class="player-seat" id="p3" style="left: 92.3%; top: 28.8%;">
                <div class="player-cards pos-left"><div class="mini-card"></div><div class="mini-card"></div></div>
                <div class="chip">3</div>
            </div>
            <div class="player-seat" id="p4" style="left: 92.9%; top: 59.5%;">
                <div class="player-cards pos-left"><div class="mini-card"></div><div class="mini-card"></div></div>
                <div class="chip">4</div>
            </div>
            <div class="player-seat" id="p5" style="left: 92.6%; top: 86.5%;">
                <div class="player-cards pos-left"><div class="mini-card"></div><div class="mini-card"></div></div>
                <div class="chip">5</div>
            </div>
            <div class="player-seat" id="p6" style="left: 6.8%; top: 85.5%;">
                <div class="player-cards pos-right"><div class="mini-card"></div><div class="mini-card"></div></div>
                <div class="chip">6</div>
            </div>
            <div class="player-seat" id="p7" style="left: 7.3%; top: 60.0%;">
                <div class="player-cards pos-right"><div class="mini-card"></div><div class="mini-card"></div></div>
                <div class="chip">7</div>
            </div>
            <div class="player-seat" id="p8" style="left: 7.7%; top: 30.1%;">
                <div class="player-cards pos-right"><div class="mini-card"></div><div class="mini-card"></div></div>
                <div class="chip">8</div>
            </div>

            <div class="seat-me" id="me" style="left: 50.7%; top: 95.0%;">
                <div class="chip">Вы</div>
            </div>

            <!-- === РЕДАКТОР === -->
            <div class="action-menu draggable" id="menu-p1" style="left: 20%; top: 15%;"><button>Ф</button><button>К</button><button>Р</button></div>
            <div class="action-menu draggable" id="menu-p2" style="left: 70%; top: 15%;"><button>Ф</button><button>К</button><button>Р</button></div>
            <div class="action-menu draggable" id="menu-p3" style="left: 70%; top: 35%;"><button>Ф</button><button>К</button><button>Р</button></div>
            <div class="action-menu draggable" id="menu-p4" style="left: 70%; top: 60%;"><button>Ф</button><button>К</button><button>Р</button></div>
            <div class="action-menu draggable" id="menu-p5" style="left: 70%; top: 85%;"><button>Ф</button><button>К</button><button>Р</button></div>
            <div class="action-menu draggable" id="menu-p6" style="left: 10%; top: 85%;"><button>Ф</button><button>К</button><button>Р</button></div>
            <div class="action-menu draggable" id="menu-p7" style="left: 10%; top: 60%;"><button>Ф</button><button>К</button><button>Р</button></div>
            <div class="action-menu draggable" id="menu-p8" style="left: 10%; top: 35%;"><button>Ф</button><button>К</button><button>Р</button></div>
            <div class="action-menu draggable" id="menu-me" style="left: 40%; top: 80%;"><button>Ф</button><button>К</button><button>Р</button></div>

            <div class="action-badge draggable badge-call" id="badge-call-p1" style="left: 30%; top: 10%;">✓</div>
            <div class="action-badge draggable badge-raise" id="badge-raise-p1" style="left: 35%; top: 10%;">3</div>
            <div class="action-badge draggable badge-call" id="badge-call-p2" style="left: 80%; top: 10%;">✓</div>
            <div class="action-badge draggable badge-raise" id="badge-raise-p2" style="left: 85%; top: 10%;">3</div>
            <div class="action-badge draggable badge-call" id="badge-call-p3" style="left: 80%; top: 30%;">✓</div>
            <div class="action-badge draggable badge-raise" id="badge-raise-p3" style="left: 85%; top: 30%;">3</div>
            <div class="action-badge draggable badge-call" id="badge-call-p4" style="left: 80%; top: 55%;">✓</div>
            <div class="action-badge draggable badge-raise" id="badge-raise-p4" style="left: 85%; top: 55%;">3</div>
            <div class="action-badge draggable badge-call" id="badge-call-p5" style="left: 80%; top: 80%;">✓</div>
            <div class="action-badge draggable badge-raise" id="badge-raise-p5" style="left: 85%; top: 80%;">3</div>
            <div class="action-badge draggable badge-call" id="badge-call-p6" style="left: 20%; top: 80%;">✓</div>
            <div class="action-badge draggable badge-raise" id="badge-raise-p6" style="left: 25%; top: 80%;">3</div>
            <div class="action-badge draggable badge-call" id="badge-call-p7" style="left: 20%; top: 55%;">✓</div>
            <div class="action-badge draggable badge-raise" id="badge-raise-p7" style="left: 25%; top: 55%;">3</div>
            <div class="action-badge draggable badge-call" id="badge-call-p8" style="left: 20%; top: 30%;">✓</div>
            <div class="action-badge draggable badge-raise" id="badge-raise-p8" style="left: 25%; top: 30%;">3</div>
            <div class="action-badge draggable badge-call" id="badge-call-me" style="left: 50%; top: 75%;">✓</div>
            <div class="action-badge draggable badge-raise" id="badge-raise-me" style="left: 55%; top: 75%;">3</div>

        </div>
    </div>

    <div class="control-panel">
        <button onclick="saveCoords()" style="background:#4caf50; color:white; padding: 12px 25px; border:none; border-radius:10px; font-size: 16px; font-weight:bold;">СОХРАНИТЬ</button>
    </div>

    <div class="modal-overlay" id="modal">
        <button class="close-btn" onclick="document.getElementById('modal').classList.remove('active')">Закрыть</button>
        <div class="modal-content" id="result-text"></div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const draggables = document.querySelectorAll('.draggable');
            
            draggables.forEach(el => {
                let initialX, initialY;
                let isDragging = false;

                el.addEventListener('touchstart', (e) => {
                    isDragging = true;
                    const touch = e.touches[0];
                    const rect = el.getBoundingClientRect();
                    initialX = touch.clientX - rect.left;
                    initialY = touch.clientY - rect.top;
                }, {passive: false});

                el.addEventListener('touchmove', (e) => {
                    if (!isDragging) return;
                    e.preventDefault();
                    const touch = e.touches[0];
                    const table = document.getElementById('table-area');
                    const tableRect = table.getBoundingClientRect();

                    let newX = touch.clientX - tableRect.left - initialX;
                    let newY = touch.clientY - tableRect.top - initialY;

                    let percentX = (newX / tableRect.width) * 100;
                    let percentY = (newY / tableRect.height) * 100;

                    percentX = Math.max(0, Math.min(90, percentX));
                    percentY = Math.max(0, Math.min(95, percentY));

                    el.style.left = percentX + '%';
                    el.style.top = percentY + '%';
                }, {passive: false});

                el.addEventListener('touchend', () => {
                    isDragging = false;
                });
            });
        });

        function saveCoords() {
            const elements = document.querySelectorAll('.draggable');
            let result = "";
            elements.forEach(el => {
                result += el.id + ": left: " + parseFloat(el.style.left).toFixed(1) + "%, top: " + parseFloat(el.style.top).toFixed(1) + "%;\n";
            });
            
            document.getElementById('result-text').innerText = result;
            document.getElementById('modal').classList.add('active');
        }
    </script>
</body>
</html>
