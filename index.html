<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Poker Bot Editor</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --table-color: #0b6623;
            --card-bg: #ffffff;
            --card-text-black: #000000;
            --card-text-red: #d32f2f;
            --panel-bg: #222222;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; user-select: none; }
        html, body { height: 100%; overflow: hidden; background-color: var(--bg-color); color: white; }
        body { display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
        
        .top-bar { display: flex; justify-content: space-between; padding: 8px 15px; background-color: #222; font-size: 14px; border-bottom: 1px solid #444; flex-shrink: 0; position: relative; z-index: 20;}
        
        .mode-switch { position: absolute; left: 15px; top: 8px; display: flex; background: #111; border-radius: 5px; overflow: hidden; font-size: 12px;}
        .mode-switch span { padding: 2px 8px; color: #888; cursor: pointer; }
        .mode-switch span.active { background: #333; color: white; }

        .table-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }

        .table-area { 
            width: 100%;
            max-width: 60vh; 
            max-height: 100%; 
            aspect-ratio: 2 / 3; 
            background-color: var(--table-color); 
            border-radius: 70px; 
            border: 6px solid #4a2c12; 
            position: relative; 
            overflow: hidden; 
        }

        /* Все игроки теперь двигаются */
        .player-seat, .seat-me { 
            position: absolute; 
            width: 40px; height: 40px; 
            background-color: rgba(0, 0, 0, 0.7); 
            border-radius: 50%; border: 2px solid #fff; 
            display: flex; align-items: center; justify-content: center; 
            font-size: 12px; font-weight: bold; color: #ccc; 
            transform: translate(-50%, -50%); 
            z-index: 10;
            cursor: grab;
        }
        .player-seat:active, .seat-me:active { cursor: grabbing; border-color: #ff9800; }

        .board { display: flex; gap: 8px; z-index: 2; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none;}
        .card { width: 40px; height: 60px; background-color: var(--card-bg); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: bold; color: var(--card-text-black); box-shadow: 0 4px 8px rgba(0,0,0,0.6); }
        .card.red { color: var(--card-text-red); }

        .my-cards { 
            position: absolute; bottom: 10%; left: 50%; transform: translateX(-50%); 
            display: flex; gap: 10px; z-index: 15; pointer-events: none;
        }
        .my-card-slot {
            width: 45px; height: 65px;
            background-color: #333; border: 2px dashed #777; border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; color: #777;
        }

        .control-panel {
            background-color: var(--panel-bg);
            border-top-left-radius: 15px; border-top-right-radius: 15px;
            padding: 15px; display: flex; flex-direction: column; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        
        .advice-text { font-size: 24px; font-weight: bold; color: #ff9800; text-align: center; }

        /* Всплывающее окно для координат */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 1000;
            display: none; flex-direction: column; padding: 20px; overflow-y: auto;
        }
        .modal-overlay.active { display: flex; }
        .modal-content { background: #222; padding: 15px; border-radius: 10px; color: #4caf50; font-family: monospace; font-size: 14px; white-space: pre-wrap; margin-top: 20px; }
        .close-btn { background: #d32f2f; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; align-self: flex-start; }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="mode-switch">
            <span class="active">Профи</span>
            <span>Быстрый</span>
        </div>
        <span>Раздача #1</span>
    </div>

    <div class="table-container">
        <div class="table-area" id="table-area">
            <!-- Теперь "Вы" тоже можно двигать -->
            <div class="seat-me" id="me" style="bottom: 3%; left: 50%; transform: translate(-50%, 50%);">Вы</div>
            
            <div class="my-cards">
                <div class="my-card-slot">?</div>
                <div class="my-card-slot">?</div>
            </div>

            <div class="board">
                <div class="card red">A♥</div>
                <div class="card red">K♦</div>
                <div class="card">7♣</div>
            </div>

            <!-- Игроки -->
            <div class="player-seat" id="p1" style="left: 50%; top: 5%;">P1</div>
            <div class="player-seat" id="p2" style="left: 85%; top: 20%;">P2</div>
            <div class="player-seat" id="p3" style="left: 85%; top: 40%;">P3</div>
            <div class="player-seat" id="p4" style="left: 85%; top: 60%;">P4</div>
            <div class="player-seat" id="p5" style="left: 65%; top: 85%;">P5</div>
            <div class="player-seat" id="p6" style="left: 35%; top: 85%;">P6</div>
            <div class="player-seat" id="p7" style="left: 15%; top: 60%;">P7</div>
            <div class="player-seat" id="p8" style="left: 15%; top: 40%;">P8</div>
            <div class="player-seat" id="p9" style="left: 15%; top: 20%;">P9</div>
        </div>
    </div>

    <div class="control-panel">
        <button onclick="saveCoords()" style="background:#4caf50; color:white; padding: 12px 25px; border:none; border-radius:10px; font-size: 16px; font-weight:bold;">СОХРАНИТЬ</button>
    </div>

    <!-- Модальное окно -->
    <div class="modal-overlay" id="modal">
        <button class="close-btn" onclick="document.getElementById('modal').classList.remove('active')">Закрыть</button>
        <div class="modal-content" id="result-text"></div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // Двигаем и игроков, и "Вы"
            const draggables = document.querySelectorAll('.player-seat, .seat-me');
            let activeElement = null;
            let initialX, initialY;

            draggables.forEach(el => {
                el.addEventListener('touchstart', (e) => {
                    activeElement = el;
                    const touch = e.touches[0];
                    const rect = el.getBoundingClientRect();
                    // Запоминаем смещение пальца относительно центра элемента
                    initialX = touch.clientX - (rect.left + rect.width / 2);
                    initialY = touch.clientY - (rect.top + rect.height / 2);
                }, {passive: false});

                el.addEventListener('touchmove', (e) => {
                    if (!activeElement) return;
                    e.preventDefault();
                    const touch = e.touches[0];
                    const table = document.getElementById('table-area');
                    const tableRect = table.getBoundingClientRect();

                    // Вычисляем координаты центра пальца в процентах от стола
                    let newX = touch.clientX - tableRect.left - initialX;
                    let newY = touch.clientY - tableRect.top - initialY;

                    let percentX = (newX / tableRect.width) * 100;
                    let percentY = (newY / tableRect.height) * 100;

                    // Ограничиваем
                    percentX = Math.max(5, Math.min(95, percentX));
                    percentY = Math.max(5, Math.min(95, percentY));

                    activeElement.style.left = percentX + '%';
                    activeElement.style.top = percentY + '%';
                    // Сбрасываем старые стили (bottom, transform), если они были у "Вы"
                    activeElement.style.bottom = 'auto';
                    activeElement.style.transform = 'translate(-50%, -50%)';
                }, {passive: false});

                el.addEventListener('touchend', () => {
                    activeElement = null;
                });
            });
        });

        function saveCoords() {
            const elements = document.querySelectorAll('.player-seat, .seat-me');
            let result = "";
            elements.forEach(el => {
                let id = el.id || 'me';
                result += id + ": left: " + parseFloat(el.style.left).toFixed(1) + "%, top: " + parseFloat(el.style.top).toFixed(1) + "%;\n";
            });
            
            // Показываем в модальном окне
            document.getElementById('result-text').innerText = result;
            document.getElementById('modal').classList.add('active');
        }
    </script>
</body>
    </html>
