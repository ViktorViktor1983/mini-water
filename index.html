<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Poker Bot</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --table-color: #0b6623;
            --card-bg: #ffffff;
            --card-text-black: #000000;
            --card-text-red: #d32f2f;
            --panel-bg: #222222;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; user-select: none; }
        html, body { height: 100%; overflow: hidden; background-color: var(--bg-color); color: white; }
        body { display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
        
        .top-bar { display: flex; justify-content: space-between; padding: 8px 15px; background-color: #222; font-size: 14px; border-bottom: 1px solid #444; flex-shrink: 0; position: relative; z-index: 20;}
        
        .mode-switch { position: absolute; left: 15px; top: 8px; display: flex; background: #111; border-radius: 5px; overflow: hidden; font-size: 12px;}
        .mode-switch span { padding: 2px 8px; color: #888; cursor: pointer; }
        .mode-switch span.active { background: #333; color: white; }

        .table-area { 
            height: 75vh; 
            background-color: var(--table-color); 
            margin: 5px 10px; 
            border-radius: 100px; 
            border: 6px solid #4a2c12; 
            position: relative; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            overflow: hidden; 
        }

        .player-seat { 
            position: absolute; 
            width: 40px; height: 40px; 
            background-color: rgba(0, 0, 0, 0.7); 
            border-radius: 50%; border: 2px solid #fff; 
            display: flex; align-items: center; justify-content: center; 
            font-size: 12px; font-weight: bold; color: #ccc; 
            transform: translate(-50%, -50%); z-index: 10;
        }
        .seat-me { 
            position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); 
            width: 40px; height: 40px; 
            background-color: rgba(0, 0, 0, 0.7); border-radius: 50%; border: 2px solid #fff; 
            display: flex; align-items: center; justify-content: center; 
            font-size: 12px; font-weight: bold; color: #ccc; z-index: 10;
        }

        .board { display: flex; gap: 8px; z-index: 2; margin-top: -40px; }
        .card { width: 45px; height: 65px; background-color: var(--card-bg); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; color: var(--card-text-black); box-shadow: 0 4px 8px rgba(0,0,0,0.6); }
        .card.red { color: var(--card-text-red); }

        .my-cards { 
            position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%); 
            display: flex; gap: 10px; z-index: 15; 
        }
        .my-card-slot {
            width: 45px; height: 65px;
            background-color: #333;
            border: 2px dashed #777;
            border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; color: #777; cursor: pointer;
        }
        .my-card-slot.filled { background-color: var(--card-bg); border: none; color: var(--card-text-black); }
        .my-card-slot.filled.red { color: var(--card-text-red); }

        .control-panel {
            flex: 1;
            background-color: var(--panel-bg);
            border-top-left-radius: 15px; border-top-right-radius: 15px;
            padding: 15px; display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .advice-text { font-size: 24px; font-weight: bold; color: #ff9800; text-align: center; }

        .matrix-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.95);
            z-index: 100;
            display: none;
            flex-direction: column;
            padding: 20px;
            overflow-y: auto;
        }
        .matrix-overlay.active { display: flex; }
        .matrix-grid {
            display: grid; grid-template-columns: repeat(13, 1fr); gap: 2px; width: 100%; aspect-ratio: 1/1; margin-top: 20px;
        }
        .matrix-cell {
            background-color: #333; border-radius: 3px; display: flex; align-items: center; justify-content: center;
            font-size: 9px; color: #aaa; cursor: pointer;
        }
        .matrix-cell:active { background-color: #ff9800; color: black; }
        
        .close-matrix { 
            align-self: flex-end; background: #d32f2f; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; 
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="mode-switch">
            <span class="active">Профи</span>
            <span>Быстрый</span>
        </div>
        <span>Раздача #1</span>
        <span style="visibility: hidden;">Пот: 3 BB</span>
    </div>

    <div class="table-area" id="table-area">
        <div class="player-seat seat-me">Вы</div>
        
        <div class="my-cards" id="my-cards">
            <div class="my-card-slot" id="slot-1" onclick="openMatrix(1)">?</div>
            <div class="my-card-slot" id="slot-2" onclick="openMatrix(2)">?</div>
        </div>

        <div class="board" id="board">
            <div class="card red">A♥</div>
            <div class="card red">K♦</div>
            <div class="card">7♣</div>
        </div>
    </div>

    <div class="control-panel">
        <div class="advice-text" id="advice-output">Ожидание хода...</div>
    </div>

    <div class="matrix-overlay" id="matrix-overlay">
        <button class="close-matrix" onclick="closeMatrix()">Закрыть</button>
        <div class="matrix-grid" id="matrix-grid"></div>
    </div>

    <script>
        // Встроенный JS
        document.addEventListener("DOMContentLoaded", () => {
            const table = document.getElementById("table-area");
            const overlay = document.getElementById("matrix-overlay");
            const grid = document.getElementById("matrix-grid");

            // 1. Игроки
            const totalSeats = 9;
            const radiusX = 40, radiusY = 40, startAngle = -90;
            for (let i = 1; i < totalSeats; i++) {
                let angle = startAngle + i * (360 / totalSeats);
                let rad = angle * (Math.PI / 180);
                let x = 50 + radiusX * Math.cos(rad);
                let y = 50 + radiusY * Math.sin(rad);
                let seat = document.createElement("div");
                seat.className = "player-seat";
                seat.innerText = "P" + i;
                seat.style.left = x + "%";
                seat.style.top = y + "%";
                table.appendChild(seat);
            }

            // 2. Матрица
            const ranks = ["A", "K", "Q", "J", "T", "9", "8", "7", "6", "5", "4", "3", "2"];
            ranks.forEach((rowRank, i) => {
                ranks.forEach((colRank, j) => {
                    let cell = document.createElement("div");
                    cell.className = "matrix-cell";
                    let text = (i === j) ? rowRank + colRank : (i < j ? rowRank + colRank + "s" : colRank + rowRank + "o");
                    cell.innerText = text;
                    cell.onclick = () => selectCard(text);
                    grid.appendChild(cell);
                });
            });
        });

        let currentSlot = 1;
        function openMatrix(slot) {
            currentSlot = slot;
            document.getElementById("matrix-overlay").classList.add("active");
        }
        function closeMatrix() {
            document.getElementById("matrix-overlay").classList.remove("active");
        }
        function selectCard(hand) {
            let isSuited = hand.includes("s");
            let rank1 = hand[0];
            let rank2 = hand[1];
            
            let slot = document.getElementById("slot-" + currentSlot);
            slot.innerText = rank1 + (isSuited ? "♠" : "♣"); // Пока условно
            slot.classList.add("filled");
            
            if (currentSlot === 1) {
                openMatrix(2); // Автоматически открываем второй слот
            } else {
                closeMatrix();
            }
        }
    </script>
</body>
    </html>
