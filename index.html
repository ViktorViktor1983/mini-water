<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Poker Bot</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --table-color: #0b6623;
            --card-bg: #ffffff;
            --card-text-black: #000000;
            --card-text-red: #d32f2f;
            --panel-bg: #222222;
            --btn-bg: #444444;
            --btn-active: #ff9800;
            
            --chip-blue: #5c9ead; 
            --chip-red: #d32f2f;  
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; user-select: none; }
        html, body { height: 100%; overflow: hidden; background-color: var(--bg-color); color: white; }
        body { display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
        
        /* Верхняя панель */
        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 8px 15px; background-color: #222; font-size: 14px; border-bottom: 1px solid #444; flex-shrink: 0; position: relative; z-index: 20;}
        .mode-switch { display: flex; background: #111; border-radius: 5px; overflow: hidden; font-size: 12px;}
        .mode-switch span { padding: 4px 10px; color: #888; cursor: pointer; }
        .mode-switch span.active { background: #333; color: white; }
        
        .top-actions { display: flex; gap: 10px; }
        .top-actions button { 
            padding: 6px 12px; border-radius: 6px; border: none; font-weight: bold; font-size: 12px; cursor: pointer; 
        }
        .btn-win { background: #4caf50; color: white; }
        .btn-lose { background: #d32f2f; color: white; }

        .table-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }

        .table-area { 
            width: 100%;
            max-width: 60vh; 
            max-height: 100%; 
            aspect-ratio: 2 / 3; 
            background-color: var(--table-color); 
            border-radius: 70px; 
            border: 6px solid #4a2c12; 
            position: relative; 
            overflow: hidden; 
        }

        .player-seat, .seat-me { 
            position: absolute; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            transform: translate(-50%, -50%); 
            z-index: 10;
            width: 40px; height: 40px;
        }

        /* Карты игроков */
        .player-cards { display: flex; gap: 2px; position: absolute; transition: opacity 0.3s; z-index: 11; }
        .pos-top { top: 100%; left: 50%; transform: translateX(-50%); margin-top: 2px; }
        .pos-left { right: 100%; top: 50%; transform: translateY(-50%); margin-right: 2px; }
        .pos-right { left: 100%; top: 50%; transform: translateY(-50%); margin-left: 2px; }
        .player-cards.hidden { opacity: 0; }
        
        .mini-card { 
            width: 14px; height: 20px; background-color: #b0b0b0; 
            border: 1px solid #555; border-radius: 2px; 
            background-image: repeating-linear-gradient(45deg, transparent, transparent 2px, rgba(0,0,0,0.1) 2px, rgba(0,0,0,0.1) 4px);
            display: flex; align-items: center; justify-content: center;
            font-size: 8px; font-weight: bold; color: transparent;
        }
        
        /* Метка BB */
        .mini-card.bb-card {
            background-image: none;
            background-color: #fff;
            color: var(--card-text-red);
            font-size: 10px;
        }

        /* Фишка (Стек) */
        .chip {
            width: 34px; height: 34px;
            background-color: var(--chip-blue);
            border-radius: 50%; border: 3px dashed #fff;
            display: flex; align-items: center; justify-content: center;
            font-size: 12px; font-weight: bold; color: white;
            text-shadow: 1px 1px 2px black; box-shadow: 0 4px 6px rgba(0,0,0,0.5);
            z-index: 12;
            transition: background-color 0.3s;
        }

        /* Кружки действий */
        .action-badge {
            position: absolute;
            width: 18px; height: 18px;
            border-radius: 50%;
            display: none;
            align-items: center; justify-content: center;
            font-size: 10px; font-weight: bold;
            z-index: 100;
            border: 1px solid #fff;
        }
        .action-badge.show { display: flex; }
        .badge-call { background-color: #4caf50; color: white; }
        .badge-raise { background-color: #ff9800; color: black; font-size: 8px; }

        /* Панели действий */
        .action-menu {
            position: absolute;
            background-color: rgba(0,0,0,0.9);
            padding: 4px; border-radius: 8px;
            display: none; gap: 4px;
            z-index: 100;
            border: 1px dashed rgba(255,255,255,0.3);
            transform: translateX(-50%); /* Центрируем, чтобы не улетало при добавлении кнопки */
        }
        .action-menu.active { display: flex; }
        .action-menu button {
            background: #444; color: white; border: none;
            padding: 8px 10px; border-radius: 6px;
            font-size: 12px; font-weight: bold; cursor: pointer;
        }
        .action-menu button:active { background: var(--btn-active); color: black; }

        /* Борд */
        .board { display: flex; gap: 5px; z-index: 2; position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%); }
        .board-slot { width: 40px; height: 60px; background-color: rgba(0, 0, 0, 0.3); border: 2px dashed #777; color: #777; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: bold; box-shadow: none; cursor: pointer;}
        .board-slot.filled { background-color: var(--card-bg); border: none; color: var(--card-text-black); }
        .board-slot.filled.red { color: var(--card-text-red); }
        .separator { width: 10px; }

        /* Мои карты */
        .my-cards { position: absolute; bottom: 15%; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; z-index: 15; transition: opacity 0.3s; }
        .my-cards.hidden { opacity: 0; }
        .my-card-slot { width: 45px; height: 65px; background-color: #333; border: 2px dashed #777; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 20px; color: #777; cursor: pointer; transition: background 0.2s;}
        .my-card-slot.filled { background-color: var(--card-bg); border: none; color: var(--card-text-black); }
        .my-card-slot.filled.red { color: var(--card-text-red); }

        .control-panel {
            background-color: var(--panel-bg);
            padding: 15px; display: flex; flex-direction: column; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .advice-text { font-size: 20px; font-weight: bold; color: #ff9800; text-align: center; }

        /* Модальные окна (Рейз и Стек) */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; display: none; align-items: center; justify-content: center; }
        .modal-overlay.active { display: flex; }
        .modal-box { background: #222; padding: 20px; border-radius: 15px; width: 90%; max-width: 350px; text-align: center; border: 1px solid #444; }
        .modal-box h3 { margin-bottom: 15px; font-size: 18px; }
        
        .input-with-btn { display: flex; align-items: center; background: #111; border: 1px solid #555; border-radius: 8px; padding: 5px; margin-bottom: 15px; }
        .input-with-btn input { flex: 1; background: transparent; border: none; color: white; font-size: 18px; text-align: center; outline: none; padding: 5px; width: 100%; }
        .input-with-btn button { background: var(--btn-active); color: black; border: none; border-radius: 6px; padding: 8px 15px; font-weight: bold; font-size: 14px; cursor: pointer; margin-left: 5px; }
        
        /* Сетки быстрых кнопок */
        .quick-bets { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
        .quick-bets button { padding: 10px 0; border-radius: 6px; border: none; background: #444; color: white; font-weight: bold; font-size: 14px; cursor: pointer; }
        .quick-bets button:active { background: var(--btn-active); color: black; }

        .stack-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
        .stack-grid button { padding: 10px 0; border-radius: 6px; border: none; background: #444; color: white; font-weight: bold; font-size: 16px; cursor: pointer; }
        .stack-grid button:active { background: var(--btn-active); color: black; }

        /* Панель ввода карт */
        .input-panel { position: absolute; bottom: -100%; left: 0; width: 100%; background-color: var(--panel-bg); border-top-left-radius: 20px; border-top-right-radius: 20px; padding: 20px; z-index: 50; transition: bottom 0.3s ease; display: flex; flex-direction: column; gap: 10px; }
        .input-panel.active { bottom: 0; }
        .row { display: flex; gap: 5px; justify-content: center; }
        .input-btn { flex: 1; padding: 15px 0; background-color: var(--btn-bg); border: none; border-radius: 8px; color: white; font-size: 18px; font-weight: bold; cursor: pointer; }
        .input-btn:active { background-color: var(--btn-active); color: black; }
        .suits-row { display: none; gap: 10px; justify-content: center; margin-top: 10px; }
        .suits-row.active { display: flex; }
        .suit-btn { flex: 1; padding: 20px 0; background-color: var(--btn-bg); border: none; border-radius: 8px; color: white; font-size: 24px; cursor: pointer; }
        .suit-btn:active { background-color: var(--btn-active); color: black; }
    </style>
</head>

    <script>
        let currentTargetId = null;
        let currentRank = "";
        let targetSeatForRaise = null;
        let targetSeatForStack = null;

        // Порядок мест по часовой стрелке
        const seatOrder = ['p1', 'p2', 'p3', 'p4', 'p5', 'me', 'p6', 'p7', 'p8'];
        let currentBBSeat = 'p1'; // Начальный BB

        // --- ЛОГИКА КАРТ ---
        const cardElements = document.querySelectorAll('.card-slot');
        cardElements.forEach(el => {
            let cardLongPress = false;
            let cardTimer = null;

            el.addEventListener('touchstart', (e) => {
                cardLongPress = false;
                cardTimer = setTimeout(() => {
                    cardLongPress = true;
                    el.innerText = "?";
                    el.classList.remove("filled", "red");
                    if (el.classList.contains('board-slot')) {
                        el.style.backgroundColor = "rgba(0, 0, 0, 0.3)";
                    }
                }, 500);
            });

            el.addEventListener('touchend', () => {
                clearTimeout(cardTimer);
                if (!cardLongPress) openInput(el.id);
            });
            el.addEventListener('touchmove', () => clearTimeout(cardTimer));
        });

        function openInput(id) {
            currentTargetId = id;
            document.getElementById('ranks-view').style.display = 'block';
            document.getElementById('suits-view').classList.remove('active');
            document.getElementById('input-panel').classList.add('active');
        }

        function closeInput() {
            document.getElementById('input-panel').classList.remove('active');
        }

        function selectRank(rank) {
            currentRank = rank;
            document.getElementById('ranks-view').style.display = 'none';
            document.getElementById('suits-view').classList.add('active');
        }

        function selectSuit(suit) {
            let newCardValue = currentRank + suit;
            let isDuplicate = false;

            cardElements.forEach(el => {
                if (el.id !== currentTargetId && el.innerText === newCardValue) {
                    isDuplicate = true;
                }
            });

            if (isDuplicate) {
                alert("Такая карта уже есть!");
                return;
            }

            let el = document.getElementById(currentTargetId);
            el.innerText = newCardValue;
            el.classList.add("filled");
            
            if (el.classList.contains('board-slot')) {
                el.style.backgroundColor = "var(--card-bg)";
            }

            if (suit === '♥' || suit === '♦') el.classList.add("red");
            else el.classList.remove("red");

            closeInput();
        }

        // --- ЛОГИКА ИГРОКОВ (Тройное нажатие, цвета, меню) ---
        const seats = document.querySelectorAll('.player-seat, .seat-me');
        seats.forEach(seat => {
            let tapCount = 0;
            let tapTimer = null;
            let longPressTimer = null;
            let isLongPress = false;

            seat.addEventListener('touchstart', (e) => {
                isLongPress = false;
                document.querySelectorAll('.action-menu').forEach(m => m.classList.remove('active'));

                longPressTimer = setTimeout(() => {
                    isLongPress = true;
                    let chip = seat.querySelector('.chip');
                    if (chip.style.backgroundColor !== 'var(--chip-red)') {
                        chip.style.backgroundColor = 'var(--chip-red)';
                        let cards = seat.querySelector('.player-cards');
                        if (cards) cards.classList.add('hidden');
                        // Если ушедший игрок был BB, сбрасываем BB
                        if (seat.id === currentBBSeat) currentBBSeat = null; 
                        updateBBVisual();
                    } else {
                        chip.style.backgroundColor = 'var(--chip-blue)';
                        let cards = seat.querySelector('.player-cards');
                        if (cards) cards.classList.remove('hidden');
                    }
                }, 500);
            });

            seat.addEventListener('touchend', (e) => {
                clearTimeout(longPressTimer);
                
                if (!isLongPress) {
                    tapCount++;
                    if (tapCount === 1) {
                        tapTimer = setTimeout(() => {
                            // Одиночное нажатие - открываем меню
                            let menu = document.getElementById('menu-' + seat.id);
                            if (menu) menu.classList.add('active');
                            tapCount = 0;
                        }, 300);
                    } else if (tapCount === 3) {
                        // Тройное нажатие - ставим BB
                        clearTimeout(tapTimer);
                        setBB(seat.id);
                        tapCount = 0;
                    }
                }
            });
            
            seat.addEventListener('touchmove', () => {
                clearTimeout(longPressTimer);
            });
        });

        document.addEventListener('touchstart', (e) => {
            if (!e.target.closest('.player-seat') && !e.target.closest('.seat-me') && !e.target.closest('.action-menu')) {
                document.querySelectorAll('.action-menu').forEach(m => m.classList.remove('active'));
            }
        });

        function doAction(seatId, action) {
            let seat = document.getElementById(seatId);
            let chip = seat.querySelector('.chip');
            let cards = seat.querySelector('.player-cards');
            let badgeCall = document.getElementById('badge-call-' + seatId);
            let badgeRaise = document.getElementById('badge-raise-' + seatId);

            if(badgeCall) badgeCall.classList.remove('show');
            if(badgeRaise) badgeRaise.classList.remove('show');

            if (action === 'fold') {
                if (seatId === 'me') {
                    document.getElementById('my-cards-container').classList.add('hidden');
                } else {
                    if (cards) cards.classList.add('hidden');
                }
                chip.style.backgroundColor = 'var(--chip-blue)';
            } else if (action === 'call') {
                if (badgeCall) badgeCall.classList.add('show');
            }
            document.querySelectorAll('.action-menu').forEach(m => m.classList.remove('active'));
        }

        // --- ЛОГИКА РЕЙЗА ---
        function openRaiseModal(seatId) {
            targetSeatForRaise = seatId;
            document.getElementById('raise-input').value = '';
            document.getElementById('raise-modal').classList.add('active');
            document.querySelectorAll('.action-menu').forEach(m => m.classList.remove('active'));
        }

        function closeRaiseModal(event) {
            if (event.target.id === 'raise-modal') {
                document.getElementById('raise-modal').classList.remove('active');
            }
        }

        function setRaise(value) {
            if (value === 'all') {
                document.getElementById('raise-input').value = 'ALL-IN';
            } else {
                document.getElementById('raise-input').value = value;
            }
            submitRaise();
        }

        function submitRaise() {
            let val = document.getElementById('raise-input').value;
            if (!val) return;

            let badgeRaise = document.getElementById('badge-raise-' + targetSeatForRaise);
            if (badgeRaise) {
                badgeRaise.innerText = val;
                badgeRaise.classList.add('show');
            }
            document.getElementById('raise-modal').classList.remove('active');
        }

        // --- ЛОГИКА СТЕКА (S) ---
        function openStackModal(seatId) {
            targetSeatForStack = seatId;
            let seat = document.getElementById(seatId);
            let currentStack = seat.querySelector('.chip').getAttribute('data-stack');
            document.getElementById('stack-input').value = currentStack || '100';
            document.getElementById('stack-modal').classList.add('active');
            document.querySelectorAll('.action-menu').forEach(m => m.classList.remove('active'));
        }

        function closeStackModal(event) {
            if (event.target.id === 'stack-modal') {
                document.getElementById('stack-modal').classList.remove('active');
            }
        }

        function setStack(num) {
            let input = document.getElementById('stack-input');
            if (input.value === '0' || input.value === '') {
                input.value = num;
            } else {
                input.value += num;
            }
        }

        function submitStack() {
            let val = document.getElementById('stack-input').value;
            if (!val) return;

            let seat = document.getElementById(targetSeatForStack);
            let chip = seat.querySelector('.chip');
            chip.setAttribute('data-stack', val);
            chip.innerText = val;
            
            document.getElementById('stack-modal').classList.remove('active');
        }

        // --- ЛОГИКА БЛАЙНДОВ ---
        function setBB(seatId) {
            let seat = document.getElementById(seatId);
            let chip = seat.querySelector('.chip');
            
            // Игнорируем, если место пустое (красное)
            if (chip.style.backgroundColor === 'var(--chip-red)') return;

            currentBBSeat = seatId;
            updateBBVisual();
        }

        function updateBBVisual() {
            // Убираем старые метки
            document.querySelectorAll('.mini-card').forEach(card => {
                card.classList.remove('bb-card');
                card.innerText = '';
            });

            // Ставим новую
            if (currentBBSeat) {
                let seat = document.getElementById(currentBBSeat);
                let cards = seat.querySelectorAll('.mini-card');
                cards.forEach(card => {
                    card.classList.add('bb-card');
                    card.innerText = 'BB';
                });
            }
        }

        // --- НОВАЯ РАЗДАЧА ---
        function resetRound(isWin) {
            // 1. Сброс карт
            cardElements.forEach(el => {
                el.innerText = "?";
                el.classList.remove("filled", "red");
                if (el.classList.contains('board-slot')) {
                    el.style.backgroundColor = "rgba(0, 0, 0, 0.3)";
                }
            });
            document.getElementById('my-cards-container').classList.remove('hidden');

            // 2. Сброс игроков (только карты и значки, цвета остаются как были)
            seats.forEach(seat => {
                let cards = seat.querySelector('.player-cards');
                if (cards && seat.id !== 'me') cards.classList.remove('hidden');
            });
            
            document.querySelectorAll('.action-badge').forEach(b => b.classList.remove('show'));

            // 3. Перемещение BB
            if (!currentBBSeat || document.getElementById(currentBBSeat).querySelector('.chip').style.backgroundColor === 'var(--chip-red)') {
                // Если BB нет или он ушел, ищем первого синего с начала
                currentBBSeat = seatOrder.find(id => document.getElementById(id).querySelector('.chip').style.backgroundColor !== 'var(--chip-red)');
            } else {
                // Ищем следующего синего по часовой стрелке
                let currentIndex = seatOrder.indexOf(currentBBSeat);
                for (let i = 1; i <= seatOrder.length; i++) {
                    let nextIndex = (currentIndex + i) % seatOrder.length;
                    let nextSeatId = seatOrder[nextIndex];
                    if (document.getElementById(nextSeatId).querySelector('.chip').style.backgroundColor !== 'var(--chip-red)') {
                        currentBBSeat = nextSeatId;
                        break;
                    }
                }
            }
            
            updateBBVisual();

            // (В будущем: логика добавления/убавления банка)
            console.log("Новая раздача. Выигрыш:", isWin);
        }
    </script>
</body>
</html>
