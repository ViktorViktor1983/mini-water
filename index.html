<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Poker Bot Editor</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --table-color: #0b6623;
            --card-bg: #ffffff;
            --card-text-black: #000000;
            --card-text-red: #d32f2f;
            --panel-bg: #222222;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; user-select: none; }
        html, body { height: 100%; overflow: hidden; background-color: var(--bg-color); color: white; }
        body { display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
        
        .top-bar { display: flex; justify-content: space-between; padding: 8px 15px; background-color: #222; font-size: 14px; border-bottom: 1px solid #444; flex-shrink: 0; position: relative; z-index: 20;}
        
        .mode-switch { position: absolute; left: 15px; top: 8px; display: flex; background: #111; border-radius: 5px; overflow: hidden; font-size: 12px;}
        .mode-switch span { padding: 2px 8px; color: #888; cursor: pointer; }
        .mode-switch span.active { background: #333; color: white; }

        .table-area { 
            height: 75vh; 
            background-color: var(--table-color); 
            margin: 5px 10px; 
            border-radius: 100px; 
            border: 6px solid #4a2c12; 
            position: relative; 
            overflow: hidden; 
        }

        /* Игроки теперь двигаются */
        .player-seat { 
            position: absolute; 
            width: 40px; height: 40px; 
            background-color: rgba(0, 0, 0, 0.7); 
            border-radius: 50%; border: 2px solid #fff; 
            display: flex; align-items: center; justify-content: center; 
            font-size: 12px; font-weight: bold; color: #ccc; 
            transform: translate(-50%, -50%); 
            z-index: 10;
            cursor: grab; /* Показываем, что можно тащить */
        }
        .player-seat:active { cursor: grabbing; border-color: #ff9800; }

        /* Карты и остальное (пока без изменений) */
        .seat-me { 
            position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); 
            width: 40px; height: 40px; 
            background-color: rgba(0, 0, 0, 0.7); border-radius: 50%; border: 2px solid #fff; 
            display: flex; align-items: center; justify-content: center; 
            font-size: 12px; font-weight: bold; color: #ccc; z-index: 10;
        }
        .board { display: flex; gap: 8px; z-index: 2; position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); }
        .card { width: 45px; height: 65px; background-color: var(--card-bg); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; color: var(--card-text-black); box-shadow: 0 4px 8px rgba(0,0,0,0.6); }
        .card.red { color: var(--card-text-red); }

        .my-cards { 
            position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%); 
            display: flex; gap: 10px; z-index: 15; 
        }
        .my-card-slot {
            width: 45px; height: 65px;
            background-color: #333; border: 2px dashed #777; border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; color: #777; cursor: pointer;
        }

        .control-panel {
            flex: 1; background-color: var(--panel-bg);
            border-top-left-radius: 15px; border-top-right-radius: 15px;
            padding: 15px; display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .advice-text { font-size: 24px; font-weight: bold; color: #ff9800; text-align: center; }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="mode-switch">
            <span class="active">Профи</span>
            <span>Быстрый</span>
        </div>
        <span>Раздача #1</span>
    </div>

    <div class="table-area" id="table-area">
        <!-- Точка отсчета (для тебя) -->
        <div class="seat-me" style="pointer-events: none;">Вы</div>
        
        <!-- Твои карты (тоже заблокированы для перетаскивания) -->
        <div class="my-cards" style="pointer-events: none;">
            <div class="my-card-slot">?</div>
            <div class="my-card-slot">?</div>
        </div>

        <!-- Общие карты (заблокированы) -->
        <div class="board" style="pointer-events: none;">
            <div class="card red">A♥</div>
            <div class="card red">K♦</div>
            <div class="card">7♣</div>
        </div>

        <!-- А вот этих ребят можно двигать! -->
        <div class="player-seat" id="p1" style="left: 50%; top: 15%;">P1</div>
        <div class="player-seat" id="p2" style="left: 80%; top: 35%;">P2</div>
        <div class="player-seat" id="p3" style="left: 80%; top: 60%;">P3</div>
        <div class="player-seat" id="p4" style="left: 65%; top: 80%;">P4</div>
        <div class="player-seat" id="p5" style="left: 35%; top: 80%;">P5</div>
        <div class="player-seat" id="p6" style="left: 20%; top: 60%;">P6</div>
        <div class="player-seat" id="p7" style="left: 20%; top: 35%;">P7</div>
        <div class="player-seat" id="p8" style="left: 35%; top: 15%;">P8</div>
        <div class="player-seat" id="p9" style="left: 50%; top: 65%;">P9</div>
    </div>

    <div class="control-panel">
        <button onclick="saveCoords()" style="background:#4caf50; color:white; padding: 15px 30px; border:none; border-radius:10px; font-size: 18px; font-weight:bold;">СОХРАНИТЬ КООРДИНАТЫ</button>
        <div class="advice-text" id="coords-output" style="font-size: 12px; color: #888; margin-top: 10px; font-family: monospace; word-break: break-all;">Двигай кружки...</div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // Логика перетаскивания (Drag and Drop)
            const seats = document.querySelectorAll('.player-seat');
            let activeSeat = null;
            let initialX, initialY;

            seats.forEach(seat => {
                // Для тач-экранов (телефон)
                seat.addEventListener('touchstart', (e) => {
                    activeSeat = seat;
                    const touch = e.touches[0];
                    const rect = seat.getBoundingClientRect();
                    initialX = touch.clientX - rect.left;
                    initialY = touch.clientY - rect.top;
                }, {passive: false});

                seat.addEventListener('touchmove', (e) => {
                    if (!activeSeat) return;
                    e.preventDefault(); // Останавливаем скролл страницы
                    const touch = e.touches[0];
                    const table = document.getElementById('table-area');
                    const tableRect = table.getBoundingClientRect();

                    // Вычисляем новые координаты в процентах
                    let newX = touch.clientX - tableRect.left - initialX + (seat.offsetWidth / 2);
                    let newY = touch.clientY - tableRect.top - initialY + (seat.offsetHeight / 2);

                    // Переводим в проценты от размера стола
                    let percentX = (newX / tableRect.width) * 100;
                    let percentY = (newY / tableRect.height) * 100;

                    seat.style.left = percentX + '%';
                    seat.style.top = percentY + '%';
                }, {passive: false});

                seat.addEventListener('touchend', () => {
                    activeSeat = null;
                });
            });
        });

        function saveCoords() {
            const seats = document.querySelectorAll('.player-seat');
            let result = "";
            seats.forEach(seat => {
                result += seat.id + ": left: " + parseFloat(seat.style.left).toFixed(1) + "%, top: " + parseFloat(seat.style.top).toFixed(1) + "%;\n";
            });
            document.getElementById('coords-output').innerText = result;
            document.getElementById('coords-output').style.color = "#4caf50";
        }
    </script>
</body>
                </html>
